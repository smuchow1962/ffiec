name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l . 2>/dev/null)" ]; then
            echo "Files need gofmt:"
            gofmt -l .
            exit 1
          fi
      # This repo is a go.work workspace with no root module, so each module is linted
      # from its own directory. Keep this list in step with go.work.
      - name: golangci-lint (cliutil)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: cliutil
          args: --timeout=5m
      - name: golangci-lint (core)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: core
          args: --timeout=5m
      - name: golangci-lint (ledger)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: ledger
          args: --timeout=5m
      - name: golangci-lint (testkit)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: testkit
          args: --timeout=5m
      - name: golangci-lint (verifier)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: verifier
          args: --timeout=5m

  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go test
        shell: bash
        # No root module (go.work workspace): name each module. Keep in step with go.work.
        run: go test -race -coverprofile=coverage.out ./cliutil/... ./core/... ./ledger/... ./testkit/... ./verifier/...        
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The vectors live in the public spec repo. This pin holds a tree where every
      # vector's files are present. Moving it to main is the condition for closing
      # mmpworks/SR-26.2-Model-Risk-Management#12.
      - uses: actions/checkout@v4
        with:
          repository: mmpworks/SR-26.2-Model-Risk-Management
          ref: 8e85a248c4fa179127e925776040454e937ddee1
          path: ffiec-public
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: run spec test vectors
        env:
          FFIEC_PUBLIC_VECTORS_DIR: ${{ github.workspace }}/ffiec-public/spec/test-vectors
        run: bash tools/check-conformance.sh

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: build all
        run: |
          go build ./core/...
          go build -o /tmp/ledger ./ledger/cmd/ledger 2>/dev/null || echo "ledger main not yet present"
          go build -o /tmp/verifier ./verifier/cmd/verifier 2>/dev/null || echo "verifier main not yet present"
